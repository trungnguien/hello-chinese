<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Blossoming Blade</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",Arial,sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000a;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .abs{position:absolute}
  /* hero card (như trong video) */
  #hero{left:10px;top:12px;width:210px;height:76px}
  #ring{position:absolute;left:0;top:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(#ffb02e var(--p,0deg),#2b2b36 0);padding:4px}
  #ring svg{width:100%;height:100%;border-radius:50%;display:block;background:#38384a}
  #lv{position:absolute;left:8px;top:50px;background:#262633;border:1.5px solid #fff9;border-radius:10px;font-size:11px;padding:0 7px;line-height:16px;font-weight:bold}
  #nm{position:absolute;left:72px;top:0;font-size:17px;font-weight:bold;letter-spacing:.3px}
  #nm i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #7cc4ff;margin-left:6px;vertical-align:-1px}
  #hpb{position:absolute;left:72px;top:23px;width:136px;height:11px;background:#1d2a14;border:1.5px solid #0009;border-radius:3px;overflow:hidden}
  #hpb b{display:block;height:100%;background:linear-gradient(#a5e65b,#5da12a);width:100%;transition:width .15s}
  #pw{position:absolute;left:72px;top:40px;height:25px;padding:0 12px 0 8px;background:#2a2a35e0;border-radius:6px;font-size:17px;font-weight:bold;display:flex;align-items:center;gap:6px}
  /* tiền */
  #res{right:10px;top:16px;display:flex;gap:6px}
  .pill{height:34px;min-width:120px;border-radius:17px;background:linear-gradient(90deg,#000a,#000c);display:flex;align-items:center;justify-content:flex-end;padding:0 14px 0 40px;font-weight:bold;font-size:20px;position:relative}
  .pill svg{position:absolute;left:-2px;top:-3px;width:40px;height:40px}
  /* boss */
  #boss{left:50%;top:104px;width:min(86vw,520px);transform:translateX(-50%);display:none}
  #boss .bn{font-size:15px;font-weight:bold;margin-left:4px}
  #boss .bb{height:14px;background:#2a1010;border:2px solid #000b;border-radius:3px;overflow:hidden;position:relative}
  #boss .bb b{display:block;height:100%;background:linear-gradient(#ffd66b,#f08a17);width:100%}
  #boss .x{position:absolute;right:2px;top:-18px;font-size:15px;font-weight:bold;color:#ffd66b}
  /* nút */
  .rb{position:absolute;width:46px;height:46px;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center}
  #back{left:14px;bottom:18px;background:#fffd;color:#d8a84a;font-size:30px;font-weight:bold;padding-bottom:4px}
  #mute{right:14px;bottom:18px;background:#000a}
  #mute svg{width:24px}
  .sk{position:absolute;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #fff;color:#fff;font-size:30px}
  .sk i{position:absolute;left:0;bottom:0;width:100%;height:0;background:#000b}
  #sk1{right:22px;bottom:84px;width:86px;height:86px;background:radial-gradient(#ffe27a,#f09a1b);font-size:38px}
  #sk2{right:116px;bottom:70px;width:62px;height:62px;background:radial-gradient(#fff08a,#e0a400)}
  #sk3{right:104px;bottom:140px;width:58px;height:58px;background:radial-gradient(#9bffb0,#26a64b)}
  #zone{left:0;pointer-events:none;width:100%;top:24%;text-align:center;font-size:28px;font-weight:bold;letter-spacing:1px;opacity:0;transition:opacity .6s;text-shadow:0 2px 8px #000}
  #zone small{display:block;font-size:14px;font-weight:normal;opacity:.85}
  @media (max-width:520px){
    #hero{transform:scale(.82);transform-origin:0 0;left:8px;top:10px}
    .pill{height:28px;min-width:74px!important;font-size:15px;padding:0 9px 0 30px}.pill svg{width:32px;height:32px;top:-2px}
    #res{right:8px;top:12px;gap:4px}
    #boss{top:84px}
  }
  .dn{position:fixed;font-weight:900;font-size:22px;pointer-events:none;transform:translate(-50%,-50%);animation:rise .8s ease-out forwards;-webkit-text-stroke:1px #000;text-shadow:0 2px 3px #000}
  @keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
  #hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 20px #f00;opacity:0;transition:opacity .25s}
  #ov{position:fixed;inset:0;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:10px}
  #ov h1{margin:0;font-size:34px;color:#ffd66b}
  #ov button{font-size:20px;padding:12px 30px;border:0;border-radius:26px;background:linear-gradient(#ffd24d,#f09a1b);color:#fff;font-weight:bold;margin-top:8px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hurt"></div>
<div id="ui">
  <div id="hero" class="abs">
    <div id="ring"><svg viewBox="0 0 64 64">
      <ellipse cx="32" cy="30" rx="24" ry="26" fill="#f6f6fc"/>
      <ellipse cx="32" cy="38" rx="15" ry="16" fill="#ffe4d2"/>
      <path d="M8 34C8 12 24 4 34 4c14 0 24 10 22 30-6-10-10-18-14-20-4 8-14 14-34 20z" fill="#fff"/>
      <path d="M16 22c8-2 20-8 24-14 2 8 8 14 14 16-12-2-24 2-38 6z" fill="#e9e9f6"/>
      <ellipse cx="25" cy="38" rx="3.4" ry="4.6" fill="#e0462e"/><ellipse cx="39" cy="38" rx="3.4" ry="4.6" fill="#e0462e"/>
      <circle cx="26" cy="36.5" r="1.3" fill="#fff"/><circle cx="40" cy="36.5" r="1.3" fill="#fff"/>
      <ellipse cx="20" cy="45" rx="3" ry="1.8" fill="#ffb3b3" opacity=".7"/><ellipse cx="44" cy="45" rx="3" ry="1.8" fill="#ffb3b3" opacity=".7"/>
    </svg></div>
    <div id="lv">Lv.1</div>
    <div id="nm">Aurora<i></i></div>
    <div id="hpb"><b></b></div>
    <div id="pw"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 21l9-9m0 0l6-6 3 3-6 6m-3 0l-4-4M14 4l6 0 0 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><span id="pwv">0</span></div>
  </div>
  <div id="res" class="abs">
    <div class="pill"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#f5a623" stroke="#8a4b08" stroke-width="3"/><circle cx="20" cy="20" r="10" fill="none" stroke="#ffd877" stroke-width="3"/></svg><span id="gold">0</span></div>
    <div class="pill" style="min-width:104px"><svg viewBox="0 0 40 40"><path d="M20 2l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#ffd25a" stroke="#a8730b" stroke-width="2.5" stroke-linejoin="round"/></svg><span id="gems">0</span></div>
  </div>
  <div id="boss" class="abs"><div class="bn">Cổ Thủ Hộ Vệ</div><div class="bb"><b></b><span class="x">x99</span></div></div>
  <div id="zone" class="abs"></div>
  <div id="back" class="rb">‹</div>
  <div id="mute" class="rb"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 9v6h4l5 4V5L7 9z"/><path id="mx" d="M15 9l6 6m0-6l-6 6" stroke="#fff" stroke-width="2" fill="none"/></svg></div>
  <div id="sk3" class="sk">✚<i></i></div>
  <div id="sk2" class="sk">⚡<i></i></div>
  <div id="sk1" class="sk">✦<i></i></div>
</div>
<div id="fade"></div>
<div id="ov"></div>

<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ============================ tiện ích ============================ */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
let _s=11;const sr=()=>(_s=(_s*16807)%2147483647)/2147483647;
const srr=(a,b)=>a+sr()*(b-a);
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n).toLocaleString();
const lerpA=(a,b,t)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t};
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0,flatShading:false},o));
const flat=(c,o={})=>mat(c,Object.assign({flatShading:true},o));
function mesh(geo,m,x=0,y=0,z=0,sh=true){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;return o}
function outline(m,s=1.07){const o=new THREE.Mesh(m.geometry,new THREE.MeshBasicMaterial({color:0x1b1830,side:THREE.BackSide}));o.scale.setScalar(s);m.add(o);return m}
function ctex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
function dSeg(px,pz,ax,az,bx,bz){const dx=bx-ax,dz=bz-az,l=dx*dx+dz*dz;let t=l?((px-ax)*dx+(pz-az)*dz)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+dx*t),pz-(az+dz*t))}
function dPath(x,z,P){let m=1e9;for(let i=0;i<P.length-1;i++)m=Math.min(m,dSeg(x,z,P[i][0],P[i][1],P[i+1][0],P[i+1][1]));return m}

/* ============================ renderer ============================ */
const cvs=$('gl');
const R=new THREE.WebGLRenderer({canvas:cvs,antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;
R.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(36,1,.5,300);
const hemi=new THREE.HemisphereLight(0xd8ecff,0x7a6a45,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,2.4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:90});
sun.shadow.bias=-.0005;sun.shadow.normalBias=.04;scene.add(sun,sun.target);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ============================ âm thanh ============================ */
let AC=null,muted=false;
function snd(k){
  if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  const P={hit:['square',220,80,.08,.12],crit:['sawtooth',420,120,.12,.14],skill:['sawtooth',120,900,.5,.18],coin:['sine',900,1500,.12,.12],boom:['sawtooth',90,30,.5,.25],zap:['square',1200,100,.25,.12],lvl:['triangle',400,1200,.5,.15],hurt:['square',160,60,.15,.14]}[k];
  o.type=P[0];o.frequency.setValueAtTime(P[1],t);o.frequency.exponentialRampToValueAtTime(P[2],t+P[3]);
  g.gain.setValueAtTime(P[4],t);g.gain.exponentialRampToValueAtTime(.001,t+P[3]+.05);o.start(t);o.stop(t+P[3]+.06)}catch(e){}}
$('mute').onclick=()=>{muted=!muted;$('mx').style.display=muted?'':'none';if(!muted)snd('coin')};
$('mx').style.display='none';

/* ============================ hạt (particles) ============================ */
const NP=1200,pPos=new Float32Array(NP*3),pCol=new Float32Array(NP*3),pVel=new Float32Array(NP*3),pBase=new Float32Array(NP*3),pLife=new Float32Array(NP),pMax=new Float32Array(NP),pG=new Float32Array(NP);let pI=0;
for(let i=0;i<NP;i++)pPos[i*3+1]=-999;
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const soft=ctex(64,64,(c,w,h)=>{const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.35,'#fffa');g.addColorStop(1,'#fff0');c.fillStyle=g;c.fillRect(0,0,w,h)});
const pts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:.55,map:soft,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
pts.frustumCulled=false;scene.add(pts);
function emit(x,y,z,n,col,spd,up,life,grav=9){const c=new THREE.Color(col);
  for(let k=0;k<n;k++){const i=pI;pI=(pI+1)%NP;const a=rnd(0,6.283),s=rnd(.3,1)*spd;
    pPos.set([x,y,z],i*3);pVel.set([Math.cos(a)*s,rnd(.3,1)*up,Math.sin(a)*s],i*3);pBase.set([c.r,c.g,c.b],i*3);pLife[i]=pMax[i]=life*rnd(.6,1);pG[i]=grav}}
function updParticles(dt){for(let i=0;i<NP;i++){if(pLife[i]>0){pLife[i]-=dt;const j=i*3;pVel[j+1]-=pG[i]*dt;pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt;const k=Math.max(0,pLife[i]/pMax[i]);pCol[j]=pBase[j]*k;pCol[j+1]=pBase[j+1]*k;pCol[j+2]=pBase[j+2]*k;if(pLife[i]<=0)pPos[j+1]=-999}}
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true}

/* ============================ hiệu ứng ============================ */
const fxs=[];
function addFx(obj,dur,upd,parent=scene){parent.add(obj);fxs.push({obj,dur,t:0,upd,parent})}
function updFx(dt){for(let i=fxs.length-1;i>=0;i--){const f=fxs[i];f.t+=dt;const k=Math.min(1,f.t/f.dur);f.upd(k,f.obj);if(k>=1){f.parent.remove(f.obj);f.obj.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&!o.material.shared)o.material.dispose()});fxs.splice(i,1)}}}
const glowTex=ctex(128,128,(c,w,h)=>{const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'#fff');g.addColorStop(.25,'#ffe9a0');g.addColorStop(.6,'#ffb02e88');g.addColorStop(1,'#ffb02e00');c.fillStyle=g;c.fillRect(0,0,w,h)});
function addMat(map,col=0xffffff,op=1){return new THREE.MeshBasicMaterial({map,color:col,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false})}
let shake=0;
function shockwave(x,z,Rr,col=0xffc13a,dur=.65){
  const g=new THREE.Group();g.position.set(x,.15,z);
  const disc=new THREE.Mesh(new THREE.CircleGeometry(1,48),addMat(glowTex,col));disc.rotation.x=-Math.PI/2;g.add(disc);
  const ring=new THREE.Mesh(new THREE.RingGeometry(.86,1,64),addMat(null,0xfff4b0));ring.rotation.x=-Math.PI/2;ring.position.y=.05;g.add(ring);
  const ring2=new THREE.Mesh(new THREE.RingGeometry(.6,.72,64),addMat(null,col));ring2.rotation.x=-Math.PI/2;ring2.position.y=.04;g.add(ring2);
  const L=new THREE.PointLight(col,60,Rr*2.2);L.position.y=2;g.add(L);
  addFx(g,dur,(k,o)=>{const e=1-Math.pow(1-k,3);o.scale.setScalar(.2+e*Rr);disc.material.opacity=1-k;ring.material.opacity=1-k*k;ring2.material.opacity=.8*(1-k);ring2.scale.setScalar(.8+k*.1);L.intensity=60*(1-k)});
  emit(x,.4,z,90,col,Rr*1.7,5,.9,6);emit(x,.4,z,50,0xffffff,Rr*2.2,3,.5,5);
}
function slash(x,z,dir,col=0xffffff,sz=1.7){
  const o=new THREE.Group();o.position.set(x,1.1,z);o.rotation.y=Math.atan2(-dir[1],dir[0]);
  const m=new THREE.Mesh(new THREE.RingGeometry(.9*sz,1.5*sz,28,1,-.95,1.9),addMat(null,col));m.rotation.x=-Math.PI/2;o.add(m);
  addFx(o,.22,(k)=>{m.material.opacity=1-k;m.scale.setScalar(1+k*.35)});
}
function bolt(x,z,col=0xfff2a0,w=.12){
  const g=new THREE.Group();let px=x+rnd(-1,1),py=26,pz=z+rnd(-1,1);const N=9;
  for(let i=1;i<=N;i++){const nx=i===N?x:x+rnd(-1.2,1.2)*(1-i/N),ny=26*(1-i/N),nz=i===N?z:z+rnd(-1.2,1.2)*(1-i/N);
    const d=new THREE.Vector3(nx-px,ny-py,nz-pz),l=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(w,w,l,5),new THREE.MeshBasicMaterial({color:col,fog:false}));
    m.position.set((px+nx)/2,(py+ny)/2,(pz+nz)/2);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());g.add(m);px=nx;py=ny;pz=nz}
  const fl=new THREE.Mesh(new THREE.CircleGeometry(2.4,32),addMat(glowTex,col));fl.rotation.x=-Math.PI/2;fl.position.set(x,.2,z);g.add(fl);
  const L=new THREE.PointLight(0xffe9a0,80,18);L.position.set(x,3,z);g.add(L);
  addFx(g,.3,k=>{g.children.forEach(c=>{if(c.material&&c.material.opacity===undefined)return;});g.scale.x=1;L.intensity=80*(1-k);fl.material.opacity=1-k;g.children.forEach(c=>{if(c.geometry&&c.geometry.type==='CylinderGeometry'){c.scale.x=c.scale.z=Math.max(.01,1-k)}})});
  emit(x,.5,z,40,col,6,6,.6,10);shake=Math.max(shake,.35);snd('zap');
}
function ringFx(x,z,col,Rr=4,dur=.7){const m=new THREE.Mesh(new THREE.RingGeometry(.9,1,48),addMat(null,col));m.rotation.x=-Math.PI/2;m.position.set(x,.2,z);addFx(m,dur,k=>{m.scale.setScalar(.5+k*Rr);m.material.opacity=1-k})}
function telegraph(x,z,r,dur,cb){
  const g=new THREE.Group();g.position.set(x,.12,z);
  const d=new THREE.Mesh(new THREE.CircleGeometry(r,40),new THREE.MeshBasicMaterial({color:0xff2a2a,transparent:true,opacity:.35,depthWrite:false,fog:false}));d.rotation.x=-Math.PI/2;g.add(d);
  const rg=new THREE.Mesh(new THREE.RingGeometry(r-.18,r,48),new THREE.MeshBasicMaterial({color:0xff6a5a,transparent:true,opacity:.9,depthWrite:false,fog:false}));rg.rotation.x=-Math.PI/2;g.add(rg);
  const inner=new THREE.Mesh(new THREE.CircleGeometry(r,40),new THREE.MeshBasicMaterial({color:0xff3a3a,transparent:true,opacity:.5,depthWrite:false,fog:false}));inner.rotation.x=-Math.PI/2;inner.position.y=.02;g.add(inner);
  let done=false;addFx(g,dur,k=>{inner.scale.setScalar(Math.max(.01,k));if(k>.98&&!done){done=true;cb&&cb()}})}

/* DOM số sát thương */
function dmgNum(x,y,z,t,col='#fff',big=false){const v=new THREE.Vector3(x,y,z).project(cam);if(v.z>1)return;const e=document.createElement('div');e.className='dn';e.textContent=t;e.style.left=(v.x*.5+.5)*innerWidth+'px';e.style.top=(-v.y*.5+.5)*innerHeight+'px';e.style.color=col;if(big)e.style.fontSize='32px';document.body.appendChild(e);setTimeout(()=>e.remove(),800)}

/* ============================ nhân vật chibi ============================ */
function chibi(o){
  const g=new THREE.Group(),parts={};
  const skin=mat(o.skin||0xffe2cc),hair=mat(o.hair),outfit=mat(o.outfit),trim=mat(o.trim||0x3d3550),dark=mat(0x2c2638);
  const body=new THREE.Group();g.add(body);parts.body=body;
  // chân
  parts.legL=new THREE.Group();parts.legR=new THREE.Group();
  [[parts.legL,-.17],[parts.legR,.17]].forEach(([p,x])=>{p.position.set(x,.62,0);p.add(mesh(new THREE.CylinderGeometry(.11,.1,.5,10),dark,0,-.2,0));p.add(mesh(new THREE.BoxGeometry(.24,.14,.34),mat(o.boot||0x4b3b34),0,-.48,.05));body.add(p)});
  // thân
  const torso=mesh(new THREE.CylinderGeometry(.28,.34,.56,14),outfit,0,.95,0);outline(torso,1.08);body.add(torso);
  const skirt=mesh(new THREE.CylinderGeometry(.36,.52,.38,14,1,true),outfit,0,.7,0);skirt.material.side=THREE.DoubleSide;body.add(skirt);
  body.add(mesh(new THREE.TorusGeometry(.33,.04,6,16),trim,0,.8,0)).rotation.x=Math.PI/2;
  if(o.cape){const c=mesh(new THREE.BoxGeometry(.6,.9,.05),mat(o.cape),0,.9,-.3);c.rotation.x=.12;body.add(c)}

function goZone(name,quick){
  const apply=()=>{
    clearZone();S.zone=name;Z=ZONES[name]();
    party.forEach((p,i)=>{if(!p.g.parent)scene.add(p.g);p.x=Z.spawn[0]+(i-1)*2.2;p.z=Z.spawn[1]+(i?1.8:0);p.cd=0});
    Z.enemies.forEach(addEnemy);
    S.hp=S.max;updHud();

    const t=$('zone');t.innerHTML=Z.name+'<small>'+Z.sub+'</small>';t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2400);
    inputLock=.3;$('fade').style.opacity=0};
  if(quick){apply();return}
  $('fade').style.opacity=1;setTimeout(apply,420)}

function hurtEnemy(e,d,crit,src){
  if(e.dead)return;e.hp-=d;e.flash=.12;
  const kx=e.x-(src?src.x:e.x),kz=e.z-(src?src.z:e.z),l=Math.hypot(kx,kz)||1;if(!e.boss){e.kx=kx/l*3;e.kz=kz/l*3}
  dmgNum(e.x,e.T.r*2+.6,e.z,Math.round(d),crit?'#ffd34d':'#fff',crit);snd(crit?'crit':'hit');
  emit(e.x,1.2,e.z,crit?14:6,crit?0xffe070:0xffffff,3,3,.4);
  if(e.hp<=0)killEnemy(e)}
function killEnemy(e){
  e.dead=true;S.kills++;zg.remove(e.g);
  emit(e.x,1,e.z,e.boss?160:30,e.boss?0x9ff0ff:0xffe08a,e.boss?10:4,6,1,7);
  const n=e.boss?24:rnd(2,4)|0;for(let i=0;i<n;i++)drops.push(mkDrop(e.x+rnd(-1,1),e.z+rnd(-1,1),Math.random()<(e.boss?.5:.12)?'gem':'gold',e.T.gold));
  gainXp(e.T.xp);
  if(e.boss)winGame()}
function mkDrop(x,z,k,rg){const m=k==='gem'?mesh(new THREE.OctahedronGeometry(.28),new THREE.MeshBasicMaterial({color:0xffd34d}),0,0,0,false):mesh(new THREE.CylinderGeometry(.28,.28,.08,14),mat(0xf6b020,{metalness:.5,roughness:.35,emissive:0x6a3c00,emissiveIntensity:.5}),0,0,0,false);
  if(k!=='gem')m.rotation.x=Math.PI/2;const g=new THREE.Group();g.add(m);g.position.set(x,.5,z);zg.add(g);return{g,m,x,z,y:.5,vy:rnd(5,8),k,v:k==='gem'?1:Math.round(rnd(rg[0],rg[1])),t:0}}
function gainXp(n){S.xp+=n;while(S.xp>=S.need){S.xp-=S.need;S.lv++;S.need=Math.floor(S.need*1.3);S.max+=18;S.atk+=4;S.hp=S.max;snd('lvl');
  party.forEach(p=>ringFx(p.x,p.z,0x9dff7a,5,.8));emit(party[0].x,1,party[0].z,60,0x9dff7a,4,8,1.2,5);
  const t=$('zone');t.innerHTML='LEVEL UP!<small>Lv.'+S.lv+'</small>';t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1400)}updHud()}
function hurtParty(d,from){if(S.over)return;S.hp-=d;snd('hurt');const h=party[0];dmgNum(h.x,3.4,h.z,Math.round(d),'#ff5a4a');
  $('hurt').style.opacity=.7;setTimeout(()=>$('hurt').style.opacity=0,160);shake=Math.max(shake,.15);
  if(S.hp<=0){S.hp=0;S.over=true;showOv('Bạn đã gục ngã','Lv.'+S.lv+' · '+S.kills+' kẻ địch','Hồi sinh',()=>{S.over=false;hideOv();goZone(S.zone)})}updHud()}
const SK={1:{cd:6,t:0},2:{cd:9,t:0},3:{cd:14,t:0}};
function nearestE(x,z,maxd){let b=null,bd=maxd;for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-x,e.z-z)-e.T.r;if(d<bd){bd=d;b=e}}return b}
function useSkill(n){
  if(S.over||S.paused||SK[n].t>0)return;const h=party[0];
  if(n===1){SK[1].t=SK[1].cd;shockwave(h.x,h.z,8);shake=.7;snd('skill');snd('boom');h.atkT=.3;
    for(const e of enemies)if(!e.dead&&Math.hypot(e.x-h.x,e.z-h.z)<8+e.T.r)hurtEnemy(e,S.atk*4.2*rnd(.9,1.2),true,h)}
  if(n===2){const list=enemies.filter(e=>!e.dead).sort((a,b)=>Math.hypot(a.x-h.x,a.z-h.z)-Math.hypot(b.x-h.x,b.z-h.z)).slice(0,5);if(!list.length)return;SK[2].t=SK[2].cd;
    list.forEach((e,i)=>setTimeout(()=>{if(!e.dead){bolt(e.x,e.z);hurtEnemy(e,S.atk*3*rnd(.9,1.2),true,h)}},i*110))}
  if(n===3){SK[3].t=SK[3].cd;const v=Math.floor(S.max*.35);S.hp=Math.min(S.max,S.hp+v);party.forEach(p=>{ringFx(p.x,p.z,0x7dff9a,3,.7);emit(p.x,.5,p.z,24,0x7dff9a,1.5,5,1,-1)});dmgNum(h.x,3.4,h.z,'+'+v,'#7dff9a');snd('coin');updHud()}
}

function showOv(h,s,btn,fn){const o=$('ov');o.innerHTML=`<h1>${h}</h1><div>${s}</div><button id="ovb">${btn}</button>`;o.style.display='flex';$('ovb').onclick=fn}
function hideOv(){$('ov').style.display='none'}
function winGame(){S.over=true;setTimeout(()=>showOv('CHIẾN THẮNG!','Đã hạ Cổ Thủ Hộ Vệ<br>Lv.'+S.lv+' · 🪙 '+S.gold+' · 💎 '+S.gems,'Chơi lại',()=>{location.reload()}),2200)}
$('back').onclick=()=>{if(S.over)return;S.paused=!S.paused;if(S.paused)showOv('Tạm dừng','','Tiếp tục',()=>{S.paused=false;hideOv()});else hideOv()};

/* ============================ HUD ============================ */
function updHud(){$('lv').textContent='Lv.'+S.lv;$('ring').style.setProperty('--p',(S.xp/S.need*360)+'deg');$('hpb').firstChild.style.width=Math.max(0,S.hp/S.max*100)+'%';
  $('pwv').textContent=fmt(S.atk*38+S.max*6);$('gold').textContent=fmt(S.gold);$('gems').textContent=fmt(S.gems)}

/* ============================ input ============================ */
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')useSkill(1);if(e.key==='1')useSkill(1);if(e.key==='2')useSkill(2);if(e.key==='3')useSkill(3)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cvs.addEventListener('pointerdown',e=>{if(joy.a)return;joy.a=true;joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.dx=joy.dy=0;try{AC&&AC.resume()}catch(_){}});
addEventListener('pointermove',e=>{if(joy.a&&e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy),m=55;if(l>m){joy.ox+=dx/l*(l-m);joy.oy+=dy/l*(l-m);dx=dx/l*m;dy=dy/l*m}joy.dx=dx/m;joy.dy=dy/m}});
const rel=e=>{if(e.pointerId===joy.id){joy.a=false;joy.dx=joy.dy=0}};addEventListener('pointerup',rel);addEventListener('pointercancel',rel);

/* ============================ vòng lặp ============================ */
const blocked=(x,z,r)=>{if(Z.blocked(x,z))return true;for(const o of Z.obst){const dx=x-o.x,dz=z-o.z;if(dx*dx+dz*dz<(o.r+r)*(o.r+r))return true}return false};
function mv(c,dx,dz,r=.5){if(!blocked(c.x+dx,c.z,r))c.x+=dx;if(!blocked(c.x,c.z+dz,r))c.z+=dz}
function swing(p){p.atkT=.28}
const camP=new THREE.Vector3(),camT=new THREE.Vector3();let mats=0;
function animChar(p,dt,moving){
  const P=p.g.userData.parts,t=S.time*12+p.ph;
  p.g.position.set(p.x,0,p.z);p.g.rotation.y=lerpA(p.g.rotation.y,p.face,Math.min(1,dt*14));
  const sw=moving?Math.sin(t)*.7:0;P.legL.rotation.x=sw;P.legR.rotation.x=-sw;P.armL.rotation.x=-sw*.6;
  P.body.position.y=moving?Math.abs(Math.sin(t))*.09:Math.sin(S.time*2+p.ph)*.015;
  p.atkT=Math.max(0,(p.atkT||0)-dt);
  P.armR.rotation.x=p.atkT>0?-2.2+(1-p.atkT/.28)*2.4:sw*.6;P.armR.rotation.z=p.atkT>0?-.4:0;
  P.body.rotation.x=moving?.08:0;
  P.head.rotation.z=Math.sin(S.time*1.6+p.ph)*.03}
function update(dt){
  S.time+=dt;if(inputLock>0)inputLock-=dt;
  if(Z.motes)Z.motes.forEach(m=>{m.position.y+=Math.sin(S.time+m.userData.ph)*.003;m.position.x+=Math.cos(S.time*.7+m.userData.ph)*.003});
  if(Z.water){Z.water.material.map.offset.x=S.time*.01;Z.water.material.map.offset.y=Math.sin(S.time*.3)*.02}
  if(Z.flames)Z.flames.forEach(([f,L],i)=>{L.intensity=26+Math.sin(S.time*9+i*2)*5+Math.random()*4;f.scale.setScalar(1+Math.sin(S.time*12+i)*.12)});
  if(Z.beam)Z.beam.material.opacity=.3+Math.sin(S.time*2)*.06;
  for(const k of[1,2,3]){SK[k].t=Math.max(0,SK[k].t-dt);$('sk'+k).lastChild.style.height=SK[k].t/SK[k].cd*100+'%'}
  const h=party[0];
  if(S.over){party.forEach(p=>animChar(p,dt,false));return}
  /* điều khiển hero */
  let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(joy.a){mx=joy.dx;mz=joy.dy}
  let l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;l=1}
  const manual=l>.15&&inputLock<=0;let moving=false;
  if(manual){idleT=0}else idleT+=dt;
  const spd=6;
  if(manual){mv(h,mx*spd*dt,mz*spd*dt);h.face=Math.atan2(mx,mz);moving=true}
  else if(idleT>.5){const e=nearestE(h.x,h.z,45);if(e){const dx=e.x-h.x,dz=e.z-h.z,d=Math.hypot(dx,dz);if(d>e.T.r+1.9){mv(h,dx/d*spd*dt,dz/d*spd*dt);moving=true}h.face=Math.atan2(dx,dz)}}
  /* đồng đội */
  const offs=[[0,0],[-2.4,2.2],[2.4,2.6]];
  for(let i=1;i<party.length;i++){const p=party[i];let tx,tz,run=false;const e=nearestE(p.x,p.z,9);
    if(e){const dx=e.x-p.x,dz=e.z-p.z,d=Math.hypot(dx,dz);tx=e.x;tz=e.z;if(d>e.T.r+1.8){mv(p,dx/d*5.4*dt,dz/d*5.4*dt);run=true}p.face=Math.atan2(dx,dz)}
    else{tx=h.x+offs[i][0];tz=h.z+offs[i][1];const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);if(d>.5){const s=Math.min(d*3,spd*1.15);mv(p,dx/d*s*dt,dz/d*s*dt);run=true;p.face=Math.atan2(dx,dz)}}
    p.moving=run}
  /* tấn công tự động */
  party.forEach((p,i)=>{p.cd-=dt;if(p.cd>0)return;const e=nearestE(p.x,p.z,2.3);if(!e)return;
    p.cd=i?.8:.62;swing(p);const dx=e.x-p.x,dz=e.z-p.z;p.face=Math.atan2(dx,dz);const crit=Math.random()<.18;
    slash(p.x,p.z,[dx,dz],i===0?0xffffff:i===1?0xffd27a:0xd6a8ff,e.boss?2.3:1.6);hurtEnemy(e,S.atk*(i?.65:1)*rnd(.9,1.15)*(crit?1.9:1),crit,p)});
  party.forEach((p,i)=>animChar(p,dt,i?p.moving:moving));
  /* kẻ địch */
  const livingAll=enemies.filter(e=>!e.dead).length;
  for(const e of enemies){if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);const fl=e.flash>0;
    e.g.traverse(o=>{if(o.isMesh&&o.material.emissive&&!o.material.shared){if(o.material._e===undefined)o.material._e=o.material.emissive.getHex();o.material.emissive.setHex(fl?0xffffff:o.material._e);o.material.emissiveIntensity=fl?.8:(o.material._ei!==undefined?o.material._ei:o.material.emissiveIntensity)}});
    if(e.kx||e.kz){const k=Math.min(1,dt*8);mv(e,e.kx*dt*4,e.kz*dt*4,e.T.r*.8);e.kx*=1-k;e.kz*=1-k;if(Math.abs(e.kx)<.05)e.kx=e.kz=0}
    const d=Math.hypot(h.x-e.x,h.z-e.z);
    if(e.boss){bossAI(e,dt);continue}
    if(!e.aggro&&d<13)e.aggro=true;
    e.cd-=dt;e.att=Math.max(0,e.att-dt);
    if(e.aggro&&!S.over){if(d>e.T.r+.9){const dx=h.x-e.x,dz=h.z-e.z;mv(e,dx/d*e.T.spd*dt,dz/d*e.T.spd*dt,e.T.r*.7);e.face=Math.atan2(dx,dz)}
      else if(e.cd<=0){e.cd=1.1;e.att=.3;hurtParty(e.T.dmg*(1+S.lv*.05))}}
    e.g.position.set(e.x,0,e.z);e.g.rotation.y=lerpA(e.g.rotation.y,e.face,Math.min(1,dt*10));
    const hop=Math.abs(Math.sin(S.time*(e.aggro?7:3)+e.ph));
    if(e.t==='slime'){const s=e.g.userData.sq;s.scale.set(1+(1-hop)*.12,.75+hop*.3,1+(1-hop)*.12);e.g.position.y=hop*(e.aggro?.5:.15)}
    else e.g.position.y=e.aggro?hop*.12:0;
    if(e.att>0)e.g.position.addScaledVector(new THREE.Vector3(Math.sin(e.face),0,Math.cos(e.face)),Math.sin(e.att/.3*Math.PI)*.6);
    e.bar.quaternion.copy(cam.quaternion);e.fill.scale.x=Math.max(.001,e.hp/e.max);e.fill.position.x=-(1-e.fill.scale.x)*.8}
  enemies=enemies.filter(e=>!e.dead);
  /* cổng */
  for(const p of portals){const open=p.on;if(!p.on&&((S.zone==='forest'&&enemies.length===0)||(S.zone==='cabin'&&S.chest))){p.on=true;p.g.visible=true;ringFx(p.x,p.z,0x9fe8ff,6,1);snd('lvl');const t=$('zone');t.innerHTML='Cổng đã mở!<small>'+p.label+'</small>';t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)}
    if(p.on){p.r.rotation.z+=dt;p.disc.material.opacity=.55+Math.sin(S.time*4)*.15;if(Math.hypot(h.x-p.x,h.z-p.z)<1.6&&!p.used){p.used=true;goZone(p.to)}}}
  /* rương */
  if(Z.cab){const c=Z.cab;if(!S.chest&&Math.hypot(h.x+4.5,h.z+.5)<2.6){S.chest=true;snd('lvl');for(let i=0;i<22;i++)drops.push(mkDrop(-4.5+rnd(-.5,.5),-.5+rnd(-.5,.5),i<6?'gem':'gold',[30,80]));emit(-4.5,1.4,-.5,80,0xffd86a,4,9,1.2,6)}
    c.open+=((S.chest?1:0)-c.open)*Math.min(1,dt*5);c.lid.rotation.x=-c.open*1.9;c.glow.material.opacity=.5+Math.sin(S.time*3)*.2+c.open*.3}
  /* rơi đồ */
  for(const d of drops){d.t+=dt;if(d.y>.5||d.vy>0){d.vy-=22*dt;d.y+=d.vy*dt;if(d.y<=.5){d.y=.5;d.vy=d.vy<-3?-d.vy*.4:0}}
    d.m.rotation.y+=dt*4;const dist=Math.hypot(h.x-d.x,h.z-d.z);
    if(d.t>.5&&dist<6){d.x+=(h.x-d.x)*Math.min(1,dt*7);d.z+=(h.z-d.z)*Math.min(1,dt*7);d.y+=(1.2-d.y)*dt*5}
    d.g.position.set(d.x,d.y,d.z);
    if(dist<.9&&d.t>.35){d.got=true;zg.remove(d.g);if(d.k==='gem')S.gems+=d.v;else S.gold+=d.v;snd('coin');updHud()}}
  drops=drops.filter(d=>!d.got);
  S.hp=Math.min(S.max,S.hp+dt*(livingAll?1.2:5));
  if(Math.floor(S.time*10)%3===0)updHud();
}
/* boss AI */
function bossAI(e,dt){
  const h=party[0];e.bt-=dt;e.g.position.set(e.x,Math.sin(S.time*1.5)*.15,e.z);e.face=lerpA(e.face,Math.atan2(h.x-e.x,h.z-e.z)*.35,dt*2);e.g.rotation.y=e.face;
  e.g.userData.core.rotation.y+=dt*2;e.g.userData.core.scale.setScalar(1+Math.sin(S.time*4)*.15);
  const f=Math.max(.001,e.hp/e.max),layers=99,cur=f*layers,frac=cur-Math.floor(cur)||1;
  $('boss').querySelector('b').style.width=frac*100+'%';$('boss').querySelector('.x').textContent='x'+Math.max(1,Math.ceil(cur));
  const rage=f<.5;
  if(e.bt<=0){e.bt=rage?2.1:3.2;
    const tg=[[h.x,h.z]];const n=rage?3:2;for(let i=0;i<n;i++){const p=party[1+(i%2)];tg.push([p.x+rnd(-3,3),p.z+rnd(-3,3)])}
    tg.forEach(([x,z],i)=>{x=Math.max(-14,Math.min(14,x));z=Math.max(-14,Math.min(14,z));
      telegraph(x,z,3.1,1.25,()=>{bolt(x,z,0xfff2a0,.2);shockwave(x,z,3.4,0xffe070,.4);for(const p of party)if(Math.hypot(p.x-x,p.z-z)<3.1)hurtParty(S.max*.12+S.lv*.8)})})}
  if(rage&&!e.rageOn){e.rageOn=true;shockwave(e.x,e.z,14,0x6fe8ff,.9);shake=1;const t=$('zone');t.innerHTML='Hộ Vệ nổi giận!';t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1600)}
}
function render(dt){
  const h=party[0];
  const port=innerWidth<innerHeight;const zk=Z.camK*(port?1:.72);
  if(cam.fov!==(port?50:40)){cam.fov=port?50:40;cam.updateProjectionMatrix()}
  const off=new THREE.Vector3(0,32*zk,21*zk);
  const tgt=new THREE.Vector3(h.x,0,h.z-1);
  if(Z.boss)tgt.set(h.x*.5,0,(h.z-6)*.5);
  camT.lerp(tgt,Math.min(1,dt*6));camP.copy(camT).add(off);
  shake=Math.max(0,shake-dt*1.8);
  cam.position.set(camP.x+rnd(-1,1)*shake,camP.y+rnd(-1,1)*shake*.6,camP.z+rnd(-1,1)*shake);cam.lookAt(camT);
  sun.position.set(h.x-16,28,h.z+10);sun.target.position.set(h.x,0,h.z);
  R.render(scene,cam)}

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!S.paused){update(dt);updFx(dt);updParticles(dt)}
  render(dt);requestAnimationFrame(loop)}

party=PARTY_DEF.map((d,i)=>({def:d,g:chibi(d),x:0,z:0,face:0,cd:0,ph:i*1.7,atkT:0,moving:false}));
scene.add(party[0].g,party[1].g,party[2].g);
Z={obst:[],blocked:()=>false,enemies:[],camK:1,spawn:[0,0]};zg=new THREE.Group();scene.add(zg);
const startZone=new URLSearchParams(location.search).get('zone')||'forest';
goZone(startZone,true);camT.set(party[0].x,0,party[0].z);
window.game={S,party,get enemies(){return enemies},goZone,useSkill,get Z(){return Z},killAll:()=>enemies.slice().forEach(e=>hurtEnemy(e,99999,true,party[0])),tp:(x,z)=>{party[0].x=x;party[0].z=z}};
requestAnimationFrame(loop);
</script>
